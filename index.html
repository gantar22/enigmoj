        let isPuzzleSolved = false;

        // Initialize List
        function initList() {
            ['etetaj', 'malgrandaj', 'mezgrandaj', 'grandaj'].forEach(id => {
                const el = document.getElementById('list-' + id);
                if(el) el.innerHTML = '';
            });
            
            Object.keys(puzzleStore).forEach(key => {
                const p = puzzleStore[key];
                const btn = document.createElement('button');
                btn.className = 'puzzle-card';
                btn.onclick = () => loadGame(key);
                
                // Check progress
                const savedJson = localStorage.getItem('cw_progress_' + key);
                const savedTime = localStorage.getItem('cw_time_' + key);
                let savedState = null;
                let status = 'Start';

                if (savedJson) {
                    savedState = JSON.parse(savedJson);
                    const filledCount = Object.keys(savedState).length;
                    
                    let totalCells = 0;
                    let correctCount = 0;
                    if (p.puzzle) {
                        p.puzzle.forEach(row => {
                            row.forEach(cell => {
                                let isBlock = cell === '#' || cell === null;
                                if (typeof cell === 'object' && cell !== null && cell.style && cell.style.shapebg === 'circle') {
                                    isBlock = false; 
                                }
                                if (!isBlock) {
                                    totalCells++;
                                    // Check correctness for status
                                    // Note: We need to find coordinates. This simple loop assumes standard grid iteration order matches logic elsewhere, 
                                    // but savedState uses "r,c" keys.
                                }
                            });
                        });
                        
                        // Re-iterate to check correctness using coordinates
                        p.puzzle.forEach((row, r) => {
                            row.forEach((cell, c) => {
                                let isBlock = cell === '#' || cell === null;
                                if (typeof cell === 'object' && cell !== null && cell.style && cell.style.shapebg === 'circle') isBlock = false;
                                if (!isBlock) {
                                    const val = savedState[`${r},${c}`];
                                    if (val && p.solution && p.solution[r][c] && val.toUpperCase() === String(p.solution[r][c]).toUpperCase()) {
                                        correctCount++;
                                    }
                                }
                            });
                        });
                    }

                    if (totalCells > 0 && filledCount >= totalCells) {
                        if (correctCount === totalCells) status = 'Solved!';
                        else status = 'Filled (Incorrect)';
                    } else {
                        if (savedTime) {
                            status = formatTime(parseInt(savedTime, 10));
                        } else {
                            status = 'In Progress';
                        }
                    }
                }

                const statusClass = status === 'Solved!' ? 'puzzle-status solved' : 'puzzle-status';

                let previewHtml = '';
                if (p.puzzle) {
                    const w = p.dimensions.width;
                    previewHtml = `<div class="puzzle-preview" style="grid-template-columns: repeat(${w}, 1fr); font-size: calc(200px / ${w} * 0.65);">`;
                    p.puzzle.forEach((row, r) => {
                        row.forEach((cell, c) => {
                            let isBlock = cell === '#' || cell === null;
                            let isCircle = false;
                            if (typeof cell === 'object' && cell !== null && cell.style && cell.style.shapebg === 'circle') {
                                isBlock = false;
                                isCircle = true;
                            }
                            
                            let letter = '';
                            if (!isBlock && savedState) {
                                letter = savedState[`${r},${c}`] || '';
                            }
                            previewHtml += `<div class="preview-cell ${isBlock ? 'block' : ''} ${isCircle ? 'circle' : ''}">${letter}</div>`;
                        });
                    });
                    previewHtml += '</div>';
                }

                let titleHtml = p.title;
                if (p.contestMode) {
                    titleHtml += ' <span class="contest-icon" title="Konkurso">🏆</span>';
                }

                btn.innerHTML = `
                    <div class="puzzle-title">${titleHtml}</div>
                    ${previewHtml}
                    <div class="${statusClass}">${status}</div>
                `;
                
                let category = 'grandaj';
                if (p.dimensions) {
                    const maxDim = Math.max(p.dimensions.width, p.dimensions.height);
                    if (maxDim <= 6) category = 'etetaj';
                    else if (maxDim <= 11) category = 'malgrandaj';
                    else if (maxDim <= 16) category = 'mezgrandaj';
                }
                
                const container = document.getElementById('list-' + category);
                if (container) container.appendChild(btn);
            });
            
            // Hide empty categories
            ['etetaj', 'malgrandaj', 'mezgrandaj', 'grandaj'].forEach(id => {
                const el = document.getElementById('list-' + id);
                const title = el.previousElementSibling;
                if (el.children.length === 0) {
                    el.style.display = 'none';
                    if (title) title.style.display = 'none';
                } else {
                    el.style.display = 'flex';
                    if (title) title.style.display = 'block';
                }
            });
        }

        function showList(updateUrl = true) {
            saveProgress();
            stopTimer();
            gameView.classList.remove('active');
            listView.classList.add('active');
            initList(); // Refresh statuses
            if (updateUrl) {
                history.pushState(null, '', window.location.pathname);
            }
        }

        function loadGame(id, updateUrl = true) {
            const record = puzzleStore[id];
            if (!record) {
                alert("Puzzle data not found! Please edit index.html and paste the JSON content into the puzzleStore object.");
                return;
            }

            currentPuzzleId = id;
            currentPuzzleData = parseIpuz(record);
            let titleHtml = record.title;
            if (record.contestMode) {
                titleHtml += ' <span class="contest-icon" title="Konkurso">🏆</span>';
            }
            document.getElementById('game-title').innerHTML = titleHtml;
            isContestMode = !!record.contestMode;
            updateContestModeUI();
            lastFilledCount = 0;
            lastActiveCell = null;
            document.getElementById('current-clue-display').textContent = '';
            document.querySelectorAll('.clue-nav').forEach(btn => btn.style.visibility = 'hidden');
            
            // Reset and load timer
            stopTimer();
            isPuzzleSolved = false;
            const savedTime = localStorage.getItem('cw_time_' + id);
            puzzleSeconds = savedTime ? parseInt(savedTime, 10) : 0;
            document.getElementById('timer-display').textContent = formatTime(puzzleSeconds);

            renderPuzzle(currentPuzzleData);
            loadProgress();
            updateProgressBar();
            
            // Check if puzzle is already solved
            if (currentPuzzleData.solution) {
                let isSolved = true;
                const inputs = document.querySelectorAll('.cell input');
                if (inputs.length === 0) isSolved = false;
                else {
                    for (const input of inputs) {
                        const r = parseInt(input.dataset.row);
                        const c = parseInt(input.dataset.col);
                        const val = input.value.toUpperCase();
                        const sol = String(currentPuzzleData.solution[r][c]).toUpperCase();
                        if (val !== sol) { isSolved = false; break; }
                    }
                }
                if (isSolved) isPuzzleSolved = true;
            }
            
            listView.classList.remove('active');
            gameView.classList.add('active');

            // Calculate max height for clues to prevent layout shifts
            adjustClueDisplayHeight();

            // Recalculate keyboard height now that the view is visible
            if (virtualKeyboardEnabled) {
                updateKeyboardState();
            }
            
            if (updateUrl) {
                history.pushState({id: id}, '', '?id=' + id);
            }

            // Start timer if not blocked by modal (updateProgressBar might have opened one)
            if (document.getElementById('completion-modal').style.display !== 'flex') {
                startTimer();
            }
        }

        function updateContestModeUI() {
            document.querySelector('.menu-reveal').style.display = isContestMode ? 'none' : 'block';
            document.querySelector('.menu-check').style.display = isContestMode ? 'none' : 'block';
            document.querySelector('.menu-clear').style.display = isContestMode ? 'none' : 'block';
        }

        // --- IPUZ Parser ---
        function parseIpuz(json) {
            return {
                width: json.dimensions.width,
                height: json.dimensions.height,
                grid: json.puzzle,
                solution: json.solution,
                clues: {
                    across: json.clues.Across || json.clues.across,
                    down: json.clues.Down || json.clues.down
                }
            };
        }

        // --- Renderer ---
        function renderPuzzle(data) {
            gridContainer.innerHTML = '';
            const gridEl = document.createElement('div');
            gridEl.className = 'crossword-grid';
            gridEl.style.setProperty('--grid-cols', data.width);
            gridEl.style.setProperty('--grid-rows', data.height);

            data.grid.forEach((row, rIndex) => {
                row.forEach((cellData, cIndex) => {
                    const cell = document.createElement('div');
                    let isBlock = cellData === '#' || cellData === null;
                    if (typeof cellData === 'object' && cellData !== null && cellData.style && cellData.style.shapebg === 'circle') {
                        isBlock = false; 
                    }
                    
                    if (isBlock) {
                        cell.className = 'cell block';
                    } else {
                        cell.className = 'cell';
                        if (typeof cellData === 'object' && cellData !== null && cellData.style && cellData.style.shapebg === 'circle') {
                            cell.classList.add('circle');
                        }

                        let num = (typeof cellData === 'object') ? cellData.cell : cellData;
                        if (num && num !== 0) {
                            const numSpan = document.createElement('span');
                            numSpan.className = 'cell-number';
                            numSpan.textContent = num;
                            cell.appendChild(numSpan);
                        }
                        const input = document.createElement('input');
                        input.dataset.row = rIndex;
                        input.dataset.col = cIndex;
                        if (virtualKeyboardEnabled) input.setAttribute('inputmode', 'none');
                        cell.appendChild(input);
                    }
                    gridEl.appendChild(cell);
                });
            });
            gridContainer.appendChild(gridEl);

            const renderClueList = (arr, container, direction) => {
                container.innerHTML = '';
                if (!arr) return;
                arr.forEach(clue => {
                    const div = document.createElement('div');
                    div.id = `clue-${direction}-${clue[0]}`;
                    div.className = 'clue-item';
                    div.innerHTML = `<span class="clue-number">${clue[0]}</span> ${clue[1]}`;
                    div.onclick = () => handleClueClick(clue[0], direction);
                    container.appendChild(div);
                });
            };

            renderClueList(data.clues.across, acrossContainer, 'across');
            renderClueList(data.clues.down, downContainer, 'down');
        }

        // --- Interaction Logic ---
        gridContainer.addEventListener('focusin', (e) => {
            if (e.target.tagName === 'INPUT') {
                justFocused = true;
                lastActiveCell = e.target;
                updateHighlights(e.target);
                setTimeout(() => justFocused = false, 200);
            }
        });

        gridContainer.addEventListener('click', (e) => {
            if (e.target.tagName === 'INPUT') {
                if (!justFocused && document.activeElement === e.target) {
                    currentDirection = currentDirection === 'across' ? 'down' : 'across';
                    updateHighlights(e.target);
                }
            }
        });

        gridContainer.addEventListener('keydown', (e) => {
            if (e.target.tagName !== 'INPUT') return;
            const r = parseInt(e.target.dataset.row);
            const c = parseInt(e.target.dataset.col);
            let moved = false;

            switch (e.key) {
                case 'ArrowUp':
                    if (currentDirection === 'across') currentDirection = 'down';
                    else moved = moveFocus(r - 1, c) || jumpToPreviousClue(r, c, 'down');
                    break;
                case 'ArrowDown':
                    if (currentDirection === 'across') currentDirection = 'down';
                    else moved = moveFocus(r + 1, c) || jumpToNextClue(r, c, 'down');
                    break;
                case 'ArrowLeft':
                    if (currentDirection === 'down') currentDirection = 'across';
                    else moved = moveFocus(r, c - 1) || jumpToPreviousClue(r, c, 'across');
                    break;
                case 'ArrowRight':
                    if (currentDirection === 'down') currentDirection = 'across';
                    else moved = moveFocus(r, c + 1) || jumpToNextClue(r, c, 'across');
                    break;
                case 'Backspace':
                    if (e.target.value === '') {
                        if (currentDirection === 'across') {
                            moved = moveFocus(r, c - 1) || jumpToPreviousClue(r, c, 'across');
                        } else {
                            moved = moveFocus(r - 1, c) || jumpToPreviousClue(r, c, 'down');
                        }
                    } else {
                        e.target.value = '';
                        saveProgress();
                        updateProgressBar(true);
                    }
                    break;
                case ' ':
                    e.preventDefault();
                    currentDirection = currentDirection === 'across' ? 'down' : 'across';
                    break;
            }
            if (!moved) updateHighlights(e.target);
        });

        gridContainer.addEventListener('input', (e) => {
            if (e.target.tagName !== 'INPUT') return;
            
            if (e.data) {
                e.target.value = e.data.slice(-1);
            } else if (e.target.value.length > 1) {
                e.target.value = e.target.value.slice(-1);
            }
            
            e.target.classList.remove('correct', 'incorrect');
            saveProgress();
            updateProgressBar(true);
            const r = parseInt(e.target.dataset.row);
            const c = parseInt(e.target.dataset.col);
            if (e.target.value.length > 0) {
                if (currentDirection === 'across') moveFocus(r, c + 1) || jumpToNextClue(r, c, 'across');
                else moveFocus(r + 1, c) || jumpToNextClue(r, c, 'down');
            }
        });

        function moveFocus(r, c) {
            const nextInput = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
            if (nextInput) {
                nextInput.focus({ preventScroll: true });
                return true;
            }
            return false;
        }

        function jumpToNextClue(r, c, dir) {
            const currentNum = findClueNumber(r, c, dir);
            if (!currentNum) return false;
            const clueList = currentPuzzleData.clues[dir];
            const currentIndex = clueList.findIndex(item => item[0] == currentNum);
            if (currentIndex === -1) return false;
            
            let nextIndex = (currentIndex + 1) % clueList.length;
            
            for (let i = 0; i < clueList.length; i++) {
                const checkIndex = (currentIndex + 1 + i) % clueList.length;
                const checkNum = clueList[checkIndex][0];
                if (!isClueFilled(checkNum, dir)) {
                    nextIndex = checkIndex;
                    break;
                }
            }
            const nextNum = clueList[nextIndex][0];
            
            for(let y=0; y<currentPuzzleData.height; y++) {
                for(let x=0; x<currentPuzzleData.width; x++) {
                    const cell = currentPuzzleData.grid[y][x];
                    let cellNum = (typeof cell === 'object' && cell !== null) ? cell.cell : cell;
                    if (cellNum == nextNum) return moveFocus(y, x);
                }
            }
            return false;
        }

        function isClueFilled(num, dir) {
            let startR = -1, startC = -1;
            for(let r=0; r<currentPuzzleData.height; r++) {
                for(let c=0; c<currentPuzzleData.width; c++) {
                    const cell = currentPuzzleData.grid[r][c];
                    let cellNum = (typeof cell === 'object' && cell !== null) ? cell.cell : cell;
                    if (cellNum == num) {
                        startR = r;
                        startC = c;
                        break;
                    }
                }
                if (startR !== -1) break;
            }
            if (startR === -1) return false;

            let currR = startR;
            let currC = startC;
            
            while(true) {
                if (currR >= currentPuzzleData.height || currC >= currentPuzzleData.width) break;
                const cellData = currentPuzzleData.grid[currR][currC];
                const isBlock = cellData === '#' || cellData === null;
                if (isBlock) break;
                
                const input = document.querySelector(`input[data-row="${currR}"][data-col="${currC}"]`);
                if (!input || input.value === '') return false;
                
                if (dir === 'across') currC++;
                else currR++;
            }
            return true;
        }

        function jumpToPreviousClue(r, c, dir) {
            const currentNum = findClueNumber(r, c, dir);
            if (!currentNum) return false;

            const clueList = currentPuzzleData.clues[dir];
            const currentIndex = clueList.findIndex(item => item[0] == currentNum);
            
            if (currentIndex === -1) return false;

            const prevIndex = (currentIndex - 1 + clueList.length) % clueList.length;
            const prevClue = clueList[prevIndex];
            const prevNum = prevClue[0];

            // Find coordinates of the start of the previous clue
            for(let startY=0; startY<currentPuzzleData.height; startY++) {
                for(let startX=0; startX<currentPuzzleData.width; startX++) {
                    const cell = currentPuzzleData.grid[startY][startX];
                    let cellNum = (typeof cell === 'object' && cell !== null) ? cell.cell : cell;
                    
                    if (cellNum == prevNum) {
                        // Found the start of the previous word. Now find its end to focus on.
                        let endR = startY, endC = startX;
                        while(true) {
                            const nextR = dir === 'across' ? endR : endR + 1;
                            const nextC = dir === 'across' ? endC + 1 : endC;
                            if (nextR >= currentPuzzleData.height || nextC >= currentPuzzleData.width || currentPuzzleData.grid[nextR][nextC] === '#' || currentPuzzleData.grid[nextR][nextC] === null) break;
                            endR = nextR; endC = nextC;
                        }
                        return moveFocus(endR, endC);
                    }
                }
            }
            return false;
        }

        function updateHighlights(input) {
            document.querySelectorAll('.active-clue').forEach(el => el.classList.remove('active-clue'));
            document.querySelectorAll('.crossing-clue').forEach(el => el.classList.remove('crossing-clue'));
            document.querySelectorAll('.cell.active-word').forEach(el => el.classList.remove('active-word'));
            const r = parseInt(input.dataset.row);
            const c = parseInt(input.dataset.col);
            const clueNum = findClueNumber(r, c, currentDirection);
            highlightWord(r, c, currentDirection);
            
            const display = document.getElementById('current-clue-display');
            const navButtons = document.querySelectorAll('.clue-nav');
            
            if (clueNum) {
                const clueEl = document.getElementById(`clue-${currentDirection}-${clueNum}`);
                if (clueEl) {
                    clueEl.classList.add('active-clue');
                    if (clueEl.offsetParent !== null) {
                        clueEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }
                
                const clueData = currentPuzzleData.clues[currentDirection].find(x => x[0] == clueNum);
                if (clueData) {
                    display.innerHTML = `<span>${clueNum}${currentDirection.charAt(0).toUpperCase()}: ${clueData[1]}</span>`;
                }
                navButtons.forEach(btn => btn.style.visibility = 'visible');
            } else {
                display.textContent = '';
                navButtons.forEach(btn => btn.style.visibility = 'hidden');
            }

            // Highlight crossing clue
            const crossingDir = currentDirection === 'across' ? 'down' : 'across';
            const crossingClueNum = findClueNumber(r, c, crossingDir);
            if (crossingClueNum) {
                const crossingClueEl = document.getElementById(`clue-${crossingDir}-${crossingClueNum}`);
                if (crossingClueEl) {
                    crossingClueEl.classList.add('crossing-clue');
                    if (crossingClueEl.offsetParent !== null) {
                        crossingClueEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }
            }
        }

        function highlightWord(r, c, dir) {
            let currR = r, currC = c;
            while (true) {
                let prevR = dir === 'across' ? currR : currR - 1;
                let prevC = dir === 'across' ? currC - 1 : currC;
                if (!document.querySelector(`input[data-row="${prevR}"][data-col="${prevC}"]`)) break;
                currR = prevR; currC = prevC;
            }
            while (true) {
                const input = document.querySelector(`input[data-row="${currR}"][data-col="${currC}"]`);
                if (!input) break;
                input.parentElement.classList.add('active-word');
                if (dir === 'across') currC++; else currR++;
            }
        }

        function findClueNumber(r, c, dir) {
            if (!currentPuzzleData) return null;
            let currR = r, currC = c;
            while (true) {
                if (currR < 0 || currC < 0) break;
                const cellData = currentPuzzleData.grid[currR][currC];
                const isBlock = cellData === '#' || cellData === null;
                if (isBlock) break;
                let num = (typeof cellData === 'object') ? cellData.cell : cellData;
                if (num && num !== 0) {
                    const prevR = dir === 'across' ? currR : currR - 1;
                    const prevC = dir === 'across' ? currC - 1 : currC;
                    let isStart = false;
                    if (prevR < 0 || prevC < 0) isStart = true;
                    else {
                        const prevCell = currentPuzzleData.grid[prevR][prevC];
                        if (prevCell === '#' || prevCell === null) isStart = true;
                    }
                    if (isStart) return num;
                }
                if (dir === 'across') currC--; else currR--;
            }
            return null;
        }

        function adjustClueDisplayHeight() {
            if (!currentPuzzleData) return;
            const display = document.getElementById('current-clue-display');
            const clueBar = document.getElementById('clue-bar');
            const originalText = display.innerHTML;
            const originalDisplay = display.style.display;
            
            display.style.height = ''; 
            display.style.display = 'block';
            display.innerHTML = '';
            
            ['across', 'down'].forEach(dir => {
                const clues = currentPuzzleData.clues[dir];
                if (clues) {
                    clues.forEach(clue => {
                        const div = document.createElement('div');
                        div.innerHTML = `${clue[0]}${dir.charAt(0).toUpperCase()}: ${clue[1]}`;
                        display.appendChild(div);
                    });
                }
            });
            
            let maxH = 0;
            Array.from(display.children).forEach(child => {
                maxH = Math.max(maxH, child.offsetHeight);
            });
            
            display.innerHTML = originalText;
            display.style.display = originalDisplay;
            display.style.height = maxH + 'px';

            if (clueBar) {
                const fullHeight = clueBar.offsetHeight;
                document.documentElement.style.setProperty('--clue-height', fullHeight + 'px');
            }
        }

        function checkPuzzle() {
            if (!currentPuzzleData || !currentPuzzleData.solution) return;
            if (isContestMode) return;

            if (localStorage.getItem('cw_suppress_check_confirm')) {
                doCheckPuzzle();
                return;
            }
            
            showConfirmModal(
                "Ĉu kontroli enigmon?",
                "Ĉu vi certas? Tio kontrolos viajn nunajn respondojn kontraŭ la solvo. Malĝustaj literoj estos markitaj ruĝe.",
                () => {
                    if (document.getElementById('confirm-dont-show').checked) {
                        localStorage.setItem('cw_suppress_check_confirm', 'true');
                    }
                    doCheckPuzzle();
                }
            );
        }

        function doCheckPuzzle() {
            document.querySelectorAll('.cell input').forEach(input => {
                const r = parseInt(input.dataset.row);
                const c = parseInt(input.dataset.col);
                const val = input.value.toUpperCase();
                const sol = currentPuzzleData.solution[r][c];
                
                input.classList.remove('correct', 'incorrect');
                
                if (val) {
                    if (val === String(sol).toUpperCase()) input.classList.add('correct');
                    else input.classList.add('incorrect');
                }
            });
        }

        function clearChecks() {
            document.querySelectorAll('.cell input').forEach(input => {
                input.classList.remove('correct', 'incorrect');
            });
        }

        function revealWord() {
            if (!currentPuzzleData || !currentPuzzleData.solution || !lastActiveCell) return;
            if (isContestMode) return;

            if (localStorage.getItem('cw_suppress_reveal_confirm')) {
                doRevealWord();
                return;
            }

            showConfirmModal(
                "Ĉu malkaŝi vorton?",
                "Ĉu vi certas? Tio plenigos la nune elektitan vorton per la ĝusta respondo. Tio ne estas malfarebla.",
                () => {
                    if (document.getElementById('confirm-dont-show').checked) {
                        localStorage.setItem('cw_suppress_reveal_confirm', 'true');
                    }
                    doRevealWord();
                }
            );
        }

        function doRevealWord() {
            
            const r = parseInt(lastActiveCell.dataset.row);
            const c = parseInt(lastActiveCell.dataset.col);
            const dir = currentDirection;

            // Find start of the word by walking backwards
            let currR = r;
            let currC = c;
            
            while (true) {
                let prevR = dir === 'across' ? currR : currR - 1;
                let prevC = dir === 'across' ? currC - 1 : currC;
                
                if (!document.querySelector(`input[data-row="${prevR}"][data-col="${prevC}"]`)) break;
                
                currR = prevR;
                currC = prevC;
            }

            // Walk forwards and fill
            while (true) {
                const input = document.querySelector(`input[data-row="${currR}"][data-col="${currC}"]`);
                if (!input) break;

                if (currentPuzzleData.solution[currR] && currentPuzzleData.solution[currR][currC]) {
                    input.value = currentPuzzleData.solution[currR][currC];
                    input.classList.remove('correct', 'incorrect');
                }

                if (dir === 'across') currC++;
                else currR++;
            }
            
            saveProgress();
            updateProgressBar(true);
        }

        function saveProgress() {
            if (!currentPuzzleId) return;
            const state = {};
            document.querySelectorAll('.cell input').forEach(input => {
                if (input.value) state[`${input.dataset.row},${input.dataset.col}`] = input.value;
            });
            localStorage.setItem('cw_progress_' + currentPuzzleId, JSON.stringify(state));
            localStorage.setItem('cw_time_' + currentPuzzleId, puzzleSeconds);
        }

        function loadProgress() {
            if (!currentPuzzleId) return;
            const saved = localStorage.getItem('cw_progress_' + currentPuzzleId);
            if (saved) {
                const state = JSON.parse(saved);
                Object.entries(state).forEach(([key, val]) => {
                    const [r, c] = key.split(',');
                    const input = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
                    if (input) input.value = val;
                });
            }
        }

        function updateProgressBar(fromUser = false) {
            const inputs = document.querySelectorAll('.cell input');
            const total = inputs.length;
            if (total === 0) return;
            
            let filled = 0;
            inputs.forEach(input => {
                if (input.value) filled++;
            });
            
            const pct = (filled / total) * 100;
            const bar = document.getElementById('progress-bar');
            bar.style.width = `${pct}%`;
            
            // Lerp from Yellow (Hue 50) to Green (Hue 120)
            const hue = 50 + (pct * 0.7);
            bar.style.backgroundColor = `hsl(${hue}, 80%, 50%)`;
            
            updateClueCompletion();

            // Show/Hide Submit button in menu based on fullness in contest mode
            const submitBtn = document.getElementById('menu-submit-btn');
            if (isContestMode && filled === total) {
                submitBtn.style.display = 'block';
            } else {
                submitBtn.style.display = 'none';
            }

            if (fromUser && filled === total && lastFilledCount < total) {
                checkAndShowModal();
            }
            lastFilledCount = filled;
        }

        function updateClueCompletion() {
            if (!currentPuzzleData) return;

            ['across', 'down'].forEach(dir => {
                if (!currentPuzzleData.clues[dir]) return;
                
                currentPuzzleData.clues[dir].forEach(clue => {
                    const num = clue[0];
                    const clueEl = document.getElementById(`clue-${dir}-${num}`);
                    if (!clueEl) return;

                    // Find start coordinates for this clue number
                    let startR = -1, startC = -1;
                    
                    for(let r=0; r<currentPuzzleData.height; r++) {
                        for(let c=0; c<currentPuzzleData.width; c++) {
                            const cell = currentPuzzleData.grid[r][c];
                            const cellNum = (typeof cell === 'object' && cell !== null) ? cell.cell : cell;
                            if (cellNum == num) {
                                startR = r;
                                startC = c;
                                break;
                            }
                        }
                        if (startR !== -1) break;
                    }

                    if (startR === -1) return;

                    // Check if all cells in this word are filled
                    let isFilled = true;
                    let currR = startR;
                    let currC = startC;

                    while(true) {
                        if (currR >= currentPuzzleData.height || currC >= currentPuzzleData.width) break;
                        
                        const cellData = currentPuzzleData.grid[currR][currC];
                        const isBlock = cellData === '#' || cellData === null;
                        if (isBlock) break;

                        const input = document.querySelector(`input[data-row="${currR}"][data-col="${currC}"]`);
                        if (!input || !input.value) {
                            isFilled = false;
                            break;
                        }

                        if (dir === 'across') currC++;
                        else currR++;
                    }

                    if (isFilled) clueEl.classList.add('clue-filled');
                    else clueEl.classList.remove('clue-filled');
                });
            });
        }

        function checkAndShowModal() {
            if (!currentPuzzleData) return;
            if (!isContestMode && !currentPuzzleData.solution) return;
            
            stopTimer();

            const modal = document.getElementById('completion-modal');
            const title = document.getElementById('modal-title');
            const msg = document.getElementById('modal-message');
            const btn = document.getElementById('modal-btn');

            if (isContestMode) {
                title.textContent = "Enigmo Plenigita";
                msg.innerHTML = `Vi plenigis la kradon. Ĉu vi volas sendi vian solvon?<br>Tempo: ${formatTime(puzzleSeconds)}`;
                btn.textContent = "Submeti Solvon";
                btn.className = "modal-btn success";
                btn.onclick = () => { closeModal(); openSubmitModal(); };
                modal.style.display = 'flex';
                return;
            }

            let isCorrect = true;
            document.querySelectorAll('.cell input').forEach(input => {
                const r = parseInt(input.dataset.row);
                const c = parseInt(input.dataset.col);
                const val = input.value.toUpperCase();
                const sol = currentPuzzleData.solution[r][c];
                if (val !== String(sol).toUpperCase()) {
                    isCorrect = false;
                }
            });

            modal.style.display = 'flex';
            if (isCorrect) {
                isPuzzleSolved = true;
                saveProgress();
                title.textContent = "Gratulon!";
                msg.innerHTML = `Vi sukcese solvis la enigmon!<br>Tempo: ${formatTime(puzzleSeconds)}`;
                btn.className = "modal-btn success";
            } else {
                title.textContent = "Preskaŭ...";
                msg.textContent = "La krado estas plena, sed estas kelkaj eraroj.";
                btn.className = "modal-btn warning";
                btn.textContent = "Fermi";
                btn.onclick = closeModal;
            }
        }

        function closeModal() {
            document.getElementById('completion-modal').style.display = 'none';
            if (!isPuzzleSolved && gameView.classList.contains('active')) {
                startTimer();
            }
        }

        // --- Confirmation Modal Logic ---
        let currentConfirmAction = null;

        function showConfirmModal(title, message, onConfirm) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            document.getElementById('confirm-dont-show').checked = false;
            currentConfirmAction = onConfirm;
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').style.display = 'none';
            currentConfirmAction = null;
        }

        function executeConfirm() {
            if (currentConfirmAction) currentConfirmAction();
            closeConfirmModal();
        }

        // --- Submit Modal Logic ---
        function openSubmitModal() {
            stopTimer();
            const puzzleRecord = puzzleStore[currentPuzzleId];
            const targetEmail = puzzleRecord.contestEmail || 'me@example.com';
            document.getElementById('submit-email-display').textContent = targetEmail;
            document.getElementById('submit-modal').style.display = 'flex';
        }

        function closeSubmitModal() {
            document.getElementById('submit-modal').style.display = 'none';
            if (gameView.classList.contains('active')) {
                startTimer();
            }
        }

        function sendSubmission() {
            const name = document.getElementById('submit-name').value;
            
            if (!name) {
                alert("Bonvolu enigi vian nomon.");
                return;
            }

            const puzzleRecord = puzzleStore[currentPuzzleId];
            const targetEmail = puzzleRecord.contestEmail || 'me@example.com';
            
            let gridString = "";
            for(let r=0; r<currentPuzzleData.height; r++) {
                for(let c=0; c<currentPuzzleData.width; c++) {
                    const input = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
                    if (input) gridString += (input.value || "_") + " ";
                    else gridString += "# ";
                }
                gridString += "\n";
            }

            const subject = encodeURIComponent(`Konkursa Solvo: ${puzzleRecord.title} (${formatTime(puzzleSeconds)})`);
            const body = encodeURIComponent(`Nomo: ${name}\n\nSolvo:\n${gridString}`);
            
            window.location.href = `mailto:${targetEmail}?subject=${subject}&body=${body}`;
            closeSubmitModal();
        }

        function copySubmission() {
            const name = document.getElementById('submit-name').value;
            
            if (!name) {
                alert("Bonvolu enigi vian nomon.");
                return;
            }

            const puzzleRecord = puzzleStore[currentPuzzleId];
            
            let gridString = "";
            for(let r=0; r<currentPuzzleData.height; r++) {
                for(let c=0; c<currentPuzzleData.width; c++) {
                    const input = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
                    if (input) gridString += (input.value || "_") + " ";
                    else gridString += "# ";
                }
                gridString += "\n";
            }

            const content = `Temo: Konkursa Solvo: ${puzzleRecord.title} (${formatTime(puzzleSeconds)})\n\nNomo: ${name}\n\nSolvo:\n${gridString}`;
            
            navigator.clipboard.writeText(content).then(() => {
                alert("Solvo kopiita al tondujo!");
                closeSubmitModal();
            }).catch(err => {
                alert("Malsukcesis kopii al tondujo. Bonvolu kopii permane.");
                console.error(err);
            });
        }

        // --- Clues Modal Logic ---
        function openCluesModal() {
            const container = document.getElementById('clues-modal-list');
            container.innerHTML = '';
            
            ['across', 'down'].forEach(dir => {
                if (!currentPuzzleData.clues[dir] || currentPuzzleData.clues[dir].length === 0) return;
                
                const h3 = document.createElement('h3');
                h3.textContent = dir === 'across' ? 'Horizontale' : 'Vertikale';
                h3.style.borderBottom = '2px solid var(--text-main)';
                h3.style.paddingBottom = '5px';
                h3.style.marginTop = '15px';
                h3.style.color = 'var(--text-main)';
                container.appendChild(h3);
                
                currentPuzzleData.clues[dir].forEach(clue => {
                    const div = document.createElement('div');
                    div.className = 'clue-item';
                    
                    // Check if filled
                    const mainClueEl = document.getElementById(`clue-${dir}-${clue[0]}`);
                    if (mainClueEl && mainClueEl.classList.contains('clue-filled')) {
                        div.classList.add('clue-filled');
                    }
                    
                    div.innerHTML = `<span class="clue-number">${clue[0]}</span> ${clue[1]}`;
                    div.style.padding = '10px 5px';
                    div.style.borderBottom = '1px solid var(--clue-bar-border)';
                    div.style.marginBottom = '0';
                    
                    div.onclick = () => {
                        closeCluesModal();
                        handleClueClick(clue[0], dir);
                    };
                    container.appendChild(div);
                });
            });
            
            document.getElementById('clues-modal').style.display = 'flex';
        }

        function closeCluesModal() {
            document.getElementById('clues-modal').style.display = 'none';
        }

        // --- Menu Logic ---
        function toggleMenu() {
            const menu = document.getElementById('game-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // Close menu when clicking outside
        window.addEventListener('click', (e) => {
            if (!e.target.matches('.hamburger-btn')) {
                const menu = document.getElementById('game-menu');
                if (menu && menu.style.display === 'block') {
                    menu.style.display = 'none';
                }
            }
        });
        
        // --- Virtual Keyboard Logic ---
        const ALT_MAP = {
            'a': ['a', 'à', 'á', 'â', 'ä'],
            'c': ['c', 'ĉ', 'ç'],
            'e': ['e', 'é', 'è', 'ê', 'ë'],
            'g': ['g', 'ĝ'],
            'h': ['h', 'ĥ'],
            'i': ['i', 'ì', 'í', 'î', 'ï'],
            'j': ['j', 'ĵ'],
            'n': ['n', 'ñ'],
            'o': ['o', 'ò', 'ó', 'ô', 'ö'],
            's': ['s', 'ŝ'],
            'u': ['u', 'ŭ', 'ù', 'ú', 'û', 'ü']
        };

        function renderKeyboard() {
            const kb = document.getElementById('virtual-keyboard');
            if (!kb) return;
            kb.innerHTML = '';
            
            const rows = keyboardMode === 'default' ? [
                ['ŝ','ĝ','e','r','t','ŭ','u','i','o','p'],
                ['a','s','d','f','g','h','j','k','l'],
                ['z','ĉ','c','v','b','n','m']
            ] : [
                ['1','2','3','4','5','6','7','8','9','0'],
                ['q','w','y','ĵ','ĥ']
            ];
            
            rows.forEach((rowChars, i) => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'kb-row';
                
                if (keyboardMode === 'default' && i === 2) {
                    rowDiv.appendChild(createKey('pli', null, 'kb-key wide', false, () => {
                        keyboardMode = 'pli';
                        renderKeyboard();
                        if (virtualKeyboardEnabled) updateKeyboardState();
                    }));
                }

                rowChars.forEach(char => {
                    const alts = (keyboardMode === 'default') ? ALT_MAP[char] : null;
                    rowDiv.appendChild(createKey(char, alts));
                });
                
                if (keyboardMode === 'default' && i === 2) {
                    rowDiv.appendChild(createKey('⌫', null, 'kb-key wide', false, () => handleVirtualKey('Backspace')));
                }
                kb.appendChild(rowDiv);
            });

            if (keyboardMode === 'pli') {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'kb-row';
                
                rowDiv.appendChild(createKey('abc', null, 'kb-key wide', false, () => {
                    keyboardMode = 'default';
                    renderKeyboard();
                    if (virtualKeyboardEnabled) updateKeyboardState();
                }));
                
                const hintDiv = document.createElement('div');
                hintDiv.style.flex = '4';
                hintDiv.style.display = 'flex';
                hintDiv.style.alignItems = 'center';
                hintDiv.style.justifyContent = 'center';
                hintDiv.style.fontSize = '0.8em';
                hintDiv.style.color = 'var(--text-secondary)';
                hintDiv.style.textAlign = 'center';
                hintDiv.innerHTML = '<span>ankaŭ provu <i>long-premon</i> por pli da opcioj</span>';
                rowDiv.appendChild(hintDiv);

                rowDiv.appendChild(createKey('⌫', null, 'kb-key wide', false, () => handleVirtualKey('Backspace')));
                kb.appendChild(rowDiv);
            }
        }

        function createKey(label, alts, className = 'kb-key', isAlt = false, customAction = null) {
            const key = document.createElement('div');
            key.className = className;
            key.textContent = label;
            
            let timer = null;
            let popup = null;

            const start = (e) => {
                if (e.cancelable && e.type === 'touchstart') e.preventDefault();
                
                if (alts && alts.length > 0) {
                    timer = setTimeout(() => {
                        showPopup();
                        if (navigator.vibrate) navigator.vibrate(50);
                    }, 400);
                }
                
                document.addEventListener('mouseup', end);
                document.addEventListener('touchend', end);
                document.addEventListener('mousemove', move);
                document.addEventListener('touchmove', move, { passive: false });
            };

            const showPopup = () => {
                popup = document.createElement('div');
                popup.className = 'kb-popup';
                alts.forEach(char => {
                    const pKey = document.createElement('div');
                    pKey.className = 'kb-popup-key';
                    pKey.textContent = char;
                    pKey.dataset.char = char;
                    if (char === label) pKey.classList.add('selected');
                    popup.appendChild(pKey);
                });
                key.appendChild(popup);
            };

            const move = (e) => {
                if (timer && !popup) {
                    // If moved significantly before timer, cancel timer? 
                    // For now, let's just keep timer running unless we want strict tap vs scroll handling.
                    // But we prevent default on touchstart, so scrolling is disabled on keys anyway.
                }
                
                if (popup) {
                    e.preventDefault();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    
                    const target = document.elementFromPoint(clientX, clientY);
                    const keys = popup.querySelectorAll('.kb-popup-key');
                    keys.forEach(k => k.classList.remove('selected'));
                    
                    if (target && target.classList.contains('kb-popup-key') && popup.contains(target)) {
                        target.classList.add('selected');
                    }
                }
            };

            const end = (e) => {
                if (timer) clearTimeout(timer);
                
                if (popup) {
                    const selected = popup.querySelector('.kb-popup-key.selected');
                    if (selected) {
                        handleVirtualKey(selected.dataset.char);
                    }
                    popup.remove();
                    popup = null;
                } else {
                    if (customAction) customAction();
                    else handleVirtualKey(label);
                }
                
                document.removeEventListener('mouseup', end);
                document.removeEventListener('touchend', end);
                document.removeEventListener('mousemove', move);
                document.removeEventListener('touchmove', move);
            };

            key.ontouchstart = start;
            key.onmousedown = start;
            
            return key;
        }

        function toggleKeyboard() {
            virtualKeyboardEnabled = !virtualKeyboardEnabled;
            localStorage.setItem('cw_virtual_keyboard', virtualKeyboardEnabled);
            updateKeyboardState();
        }

        function updateKeyboardState() {
            const kb = document.getElementById('virtual-keyboard');
            const body = document.body;
            
            if (virtualKeyboardEnabled) {
                kb.classList.add('active');
                body.classList.add('kb-active');
                document.querySelectorAll('.cell input').forEach(el => el.setAttribute('inputmode', 'none'));
                
                const height = kb.offsetHeight;
                document.documentElement.style.setProperty('--kb-height', height + 'px');
            } else {
                kb.classList.remove('active');
                body.classList.remove('kb-active');
                document.querySelectorAll('.cell input').forEach(el => el.removeAttribute('inputmode'));
                document.documentElement.style.removeProperty('--kb-height');
            }
        }

        function handleVirtualKey(key) {
            if (!lastActiveCell) return;
            
            if (key === 'Backspace') {
                const r = parseInt(lastActiveCell.dataset.row);
                const c = parseInt(lastActiveCell.dataset.col);
                if (lastActiveCell.value === '') {
                    if (currentDirection === 'across') moveFocus(r, c - 1) || jumpToPreviousClue(r, c, 'across');
                    else moveFocus(r - 1, c) || jumpToPreviousClue(r, c, 'down');
                } else {
                    lastActiveCell.value = '';
                    saveProgress();
                    updateProgressBar(true);
                }
            } else {
                lastActiveCell.value = key;
                lastActiveCell.classList.remove('correct', 'incorrect');
                saveProgress();
                updateProgressBar(true);
                
                const r = parseInt(lastActiveCell.dataset.row);
                const c = parseInt(lastActiveCell.dataset.col);
                if (currentDirection === 'across') moveFocus(r, c + 1) || jumpToNextClue(r, c, 'across');
                else moveFocus(r + 1, c) || jumpToNextClue(r, c, 'down');
            }
        }

        function navigateClue(direction) {
            if (!lastActiveCell) return;
            const r = parseInt(lastActiveCell.dataset.row);
            const c = parseInt(lastActiveCell.dataset.col);
            
            if (direction === 1) {
                jumpToNextClue(r, c, currentDirection);
            } else {
                jumpToPreviousClue(r, c, currentDirection);
            }
        }

        function handleClueClick(number, direction) {
            if (!currentPuzzleData) return;
            
            for(let r=0; r<currentPuzzleData.height; r++) {
                for(let c=0; c<currentPuzzleData.width; c++) {
                    const cell = currentPuzzleData.grid[r][c];
                    let cellNum = (typeof cell === 'object' && cell !== null) ? cell.cell : cell;
                    
                    if (cellNum == number) {
                        currentDirection = direction;
                        const input = document.querySelector(`input[data-row="${r}"][data-col="${c}"]`);
                        if (input) input.focus();
                        return;
                    }
                }
            }
        }

        // --- Timer Logic ---
        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer() {
            if (timerInterval) return;
            if (isPuzzleSolved) return;
            timerInterval = setInterval(() => {
                puzzleSeconds++;
                document.getElementById('timer-display').textContent = formatTime(puzzleSeconds);
                if (puzzleSeconds % 10 === 0) saveProgress();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        // Pause timer when page loses focus/visibility
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopTimer();
                saveProgress();
            } else if (gameView.classList.contains('active') && document.getElementById('completion-modal').style.display !== 'flex' && document.getElementById('submit-modal').style.display !== 'flex') {
                startTimer();
            }
        });

        window.addEventListener('blur', () => {
            stopTimer();
            saveProgress();
        });

        window.addEventListener('focus', () => {
            if (gameView.classList.contains('active') && document.getElementById('completion-modal').style.display !== 'flex' && document.getElementById('submit-modal').style.display !== 'flex') {
                startTimer();
            }
        });

        // --- Theme Logic ---
        function initTheme() {
            const savedTheme = localStorage.getItem('cw_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('cw_theme', newTheme);
        }

        // Start
        initTheme();
        initList();
        renderKeyboard();
        updateKeyboardState();

        // Handle Browser Navigation
        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.id) {
                loadGame(e.state.id, false);
            } else {
                showList(false);
            }
        });

        // Check URL for shared puzzle
        const params = new URLSearchParams(window.location.search);
        const urlId = params.get('id');
        if (urlId && puzzleStore[urlId]) {
            history.replaceState({id: urlId}, '', window.location.href);
            loadGame(urlId, false);
        }

        // Consent Logic
        function checkConsent() {
            if (!localStorage.getItem('cw_consent_acknowledged')) {
                document.getElementById('consent-banner').style.display = 'block';
            }
        }

        function acceptConsent() {
            localStorage.setItem('cw_consent_acknowledged', 'true');
            document.getElementById('consent-banner').style.display = 'none';
        }
        checkConsent();

        // Handle resize to update clue display height
        window.addEventListener('resize', () => {
            if (gameView.classList.contains('active')) {
                adjustClueDisplayHeight();
                if (virtualKeyboardEnabled) updateKeyboardState();
            }
        });
    </script>
